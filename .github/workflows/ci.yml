name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: End-to-end conversion
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install Microsoft YaHei font
        run: |
          FONT_DIR="$HOME/.fonts"
          mkdir -p "$FONT_DIR"
          wget -q "https://github.com/fernvenue/microsoft-yahei/raw/master/msyh.ttc" -O "$FONT_DIR/msyh.ttc"
          wget -q "https://github.com/fernvenue/microsoft-yahei/raw/master/msyhbd.ttc" -O "$FONT_DIR/msyhbd.ttc"
          wget -q "https://github.com/fernvenue/microsoft-yahei/raw/master/msyhl.ttc" -O "$FONT_DIR/msyhl.ttc"
          fc-cache -f

      - name: Install npm dependencies
        working-directory: scripts
        run: npm ci

      - name: Run end-to-end test
        run: scripts/test-e2e.sh

      - name: Upload generated PPTX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-pptx
          path: test/output.pptx
          if-no-files-found: ignore
